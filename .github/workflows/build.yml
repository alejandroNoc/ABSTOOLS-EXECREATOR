name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pandas openpyxl pyinstaller
      - run: pyinstaller --onefile --noconsole combinar_csvs.py
      - uses: actions/upload-artifact@v3
        with:
          name: exe
          path: dist/combinar_csvs.exe
