name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas openpyxl pyexcelerate pywin32 pyinstaller
      - name: Detectar archivo Python y compilar
        shell: powershell
        run: |
          $archivo = Get-ChildItem -Path . -Filter *.py | Select-Object -First 1
          if ($null -eq $archivo) {
            Write-Error "No se encontro ningun archivo .py en el repositorio."
            exit 1
          }
          Write-Host "Compilando: $($archivo.Name)"
          pyinstaller --onefile --noconsole $archivo.FullName
          echo "NOMBRE_EXE=$($archivo.BaseName)" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/${{ env.NOMBRE_EXE }}.exe
